spring.application.name=menu-service
server.port=8081

# Database connection properties with encoding specified
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}/${PGDATABASE:postgres}?characterEncoding=UTF-8
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings 
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA/Hibernate properties - Allow table creation but preserve data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false

# Disable open in view pattern
spring.jpa.open-in-view=false

# CRITICAL: Prevent any automatic database initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.datasource.initialization-mode=never

# Register the EnvLoader
context.initializer.classes=rizzerve.menuservice.config.EnvLoader

# JWT Settings
jwt.secret=5170c563e2abfd66aef4d6e842640a489f7b54d75e036c984d67b7c78113c0c8
jwt.expiration=86400000

# Enable @PreAuthorize annotations
spring.security.enabled=true

# Allow bean definition overriding (as a precaution)
spring.main.allow-bean-definition-overriding=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Custom metrics
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
